[project]
site_name = "Lance"
site_description = "Open Lakehouse Format for Multimodal AI"
site_url = "https://prrao87.github.io/lance/"
docs_dir = "src"
site_dir = "site"
repo_name = "lance-format/lance"
repo_url = "https://github.com/lance-format/lance"
copyright = "© 2025 Lance Format. All rights reserved."
extra_css = ["assets/stylesheets/home.css"]
markdown_extensions = [
  "admonition",
  "pymdownx.details",
  "pymdownx.superfences",
  "pymdownx.highlight",
  "pymdownx.inlinehilite",
  { "pymdownx.snippets" = { base_path = ["src"], check_paths = true } },
  "pymdownx.tabbed",
  "attr_list",
  "md_in_html",
  "tables",
  "toc",
]
plugins = [{ module = "search" }]
nav = [
  { Home = "index.md" },
  { "Getting Started" = [
    { Overview = "quickstart/index.md" },
    "quickstart/versioning.md",
    "quickstart/vector-search.md",
    "quickstart/full-text-search.md",
  ] },
  { "User Guide" = [
    "guide/read_and_write.md",
    "guide/data_types.md",
    "guide/data_evolution.md",
    "guide/blob.md",
    "guide/json.md",
    "guide/tags_and_branches.md",
    "guide/object_store.md",
    "guide/distributed_write.md",
    "guide/migration.md",
    "guide/performance.md",
    "guide/tokenizer.md",
    "guide/arrays.md",
  ] },
  { Specification = [
    { Overview = "format/index.md" },
    { "File Format" = [
      { Overview = "format/file/index.md" },
      { "Encoding Strategy" = "format/file/encoding.md" },
      { Versioning = "format/file/versioning.md" },
    ] },
    { "Table Format" = [
      { Overview = "format/table/index.md" },
      { "Schema Format Specification" = "format/table/schema.md" },
      { "Format Versioning Specification" = "format/table/versioning.md" },
      { "Transaction Specification" = "format/table/transaction.md" },
      { "Storage Layout Specification" = "format/table/layout.md" },
      { "Branch and Tag Specification" = "format/table/branch_tag.md" },
      { "Row ID and Lineage Specification" = "format/table/row_id_lineage.md" },
      { "MemTable & WAL Specification (Experimental)" = "format/table/mem_wal.md" },
      { Index = [
        { Overview = "format/table/index/index.md" },
        { "Scalar Indices" = [
          { BTree = "format/table/index/scalar/btree.md" },
          { Bitmap = "format/table/index/scalar/bitmap.md" },
          { "Label List" = "format/table/index/scalar/label_list.md" },
          { "Zone Map" = "format/table/index/scalar/zonemap.md" },
          { "Bloom Filter" = "format/table/index/scalar/bloom_filter.md" },
          { "Full Text Search" = "format/table/index/scalar/fts.md" },
          { NGram = "format/table/index/scalar/ngram.md" },
          { RTree = "format/table/index/scalar/rtree.md" },
        ] },
        { "Vector Indices" = [
          { Overview = "format/table/index/vector/index.md" },
        ] },
        { "System Indices" = [
          { "Fragment Reuse" = "format/table/index/system/frag_reuse.md" },
          { MemWAL = "format/table/index/system/mem_wal.md" },
        ] },
      ] },
    ] },
  ] },
  { Examples = [
    { Python = [
      "examples/python/llm_dataset_creation.md",
      "examples/python/llm_training.md",
      "examples/python/flickr8k_dataset_creation.md",
      "examples/python/clip_training.md",
      "examples/python/artifact_management.md",
    ] },
    { Rust = [
      "examples/rust/write_read_dataset.md",
      "examples/rust/hnsw.md",
      "examples/rust/llm_dataset_creation.md",
    ] },
  ] },
  { Integrations = [
    "integrations/datafusion.md",
    "integrations/duckdb.md",
    { PostgreSQL = "https://github.com/lancedb/pglance" },
    "integrations/pytorch.md",
    "integrations/tensorflow.md",
  ] },
  { Community = [
    { Overview = "community/index.md" },
    "community/maintainers.md",
    "community/pmc.md",
    "community/communication.md",
    "community/voting.md",
    "community/contributing.md",
    "community/release.md",
    "community/project-specific/index.md",
  ] },
  { "SDK Docs" = "sdk_docs.md" },
]

[project.theme]
name = "material"
logo = "logo/white.png"
favicon = "logo/logo.png"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.instant",
  "navigation.tracking",
  "navigation.top",
  "search.highlight",
  "search.share",
  "content.code.copy",
  "content.code.annotate",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"

[project.theme.palette.toggle]
icon = "material/weather-night"
name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"

[project.theme.palette.toggle]
icon = "material/weather-sunny"
name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/lance-format/lance"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/lance"

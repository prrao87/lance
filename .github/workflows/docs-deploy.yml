name: publish-site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: .uv-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "docs/pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Sync docs dependencies
        working-directory: docs
        run: uv sync --all-extras

      - name: Build docs
        working-directory: docs
        run: |
          set -euo pipefail
          python3 tools/render_proto_macros.py --input src --output .generated/src
          mkdir -p .generated
          sed 's|docs_dir = "src"|docs_dir = ".generated/src"|' zensical.toml > .generated/zensical.toml
          uv run zensical build -f .generated/zensical.toml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
